name: Check Fandom source format
on:
  push:
    branches: [diagnostics/fandom-access]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect representative source templates
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, json
          url="https://fisch.fandom.com/api.php?"+urllib.parse.urlencode(dict(action="query",format="json",formatversion="2",prop="revisions",rvprop="ids|timestamp|content",rvslots="main",titles="Megalodon|Sunken Rod|Beak Bill|Angler|Acidgrinder"))
          req=urllib.request.Request(url,headers={"User-Agent":"FischFinderDataCheck/1.0 (https://github.com/CaptainMario4/Fisch-Finder)"})
          with urllib.request.urlopen(req,timeout=25) as r: data=json.load(r)
          for p in data["query"]["pages"]:
              content=(p.get("revisions") or [{}])[0].get("slots",{}).get("main",{}).get("content","")
              print("RAW_SAMPLE "+json.dumps({"page":p["title"],"text":content[:7000]}))
          
          PY
