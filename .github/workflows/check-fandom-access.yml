name: Verify live secondary cache
on:
  push:
    branches: [diagnostics/fandom-access]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read public live API metadata
        run: |
          node --input-type=module <<'NODE'
          for (const key of ['fish','rods']) {
            const response = await fetch('https://fisch-finder-moonke1-0c07.wix-site-host.com/api/'+key+'.json?verify=c53cd750ebc144cd373feabb3050b281d5fa5878', {signal:AbortSignal.timeout(55000)});
            if(!response.ok) throw new Error('Live API HTTP '+response.status);
            const data = await response.json();
            console.log(JSON.stringify({key,mode:data.mode,count:data[key].length,secondaryData:data.secondaryData,notice:data.notice}));
            if(key==='fish' && !data.secondaryData) throw new Error('Secondary metadata absent');
          }
          NODE
